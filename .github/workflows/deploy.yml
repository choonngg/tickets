name: Deploy

on:
  # 운영 환경 준비 전까지 수동 실행만. 운영 연결 시 push 트리거 복구(_workspace/deploy/prod_cutover.md)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: book-tickets-backend
  NGINX_IMAGE_NAME: book-tickets-nginx

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew --no-daemon test

      - name: Run backend integration tests
        working-directory: backend
        run: ./gradlew --no-daemon integrationTest

      - name: Upload integration test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: backend/build/reports/tests/integrationTest
          if-no-files-found: ignore

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      backend-image: ${{ steps.images.outputs.backend-image }}
      nginx-image: ${{ steps.images.outputs.nginx-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: images
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BACKEND_IMAGE="${REGISTRY}/${OWNER}/${BACKEND_IMAGE_NAME}:${GITHUB_SHA}"
          NGINX_IMAGE="${REGISTRY}/${OWNER}/${NGINX_IMAGE_NAME}:${GITHUB_SHA}"
          BACKEND_LATEST_IMAGE="${REGISTRY}/${OWNER}/${BACKEND_IMAGE_NAME}:latest"
          NGINX_LATEST_IMAGE="${REGISTRY}/${OWNER}/${NGINX_IMAGE_NAME}:latest"
          echo "backend-image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "nginx-image=${NGINX_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "backend-latest-image=${BACKEND_LATEST_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "nginx-latest-image=${NGINX_LATEST_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ steps.images.outputs.backend-image }}
            ${{ steps.images.outputs.backend-latest-image }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: |
            ${{ steps.images.outputs.nginx-image }}
            ${{ steps.images.outputs.nginx-latest-image }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATA_REDIS_HOST: ${{ secrets.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT: ${{ secrets.SPRING_DATA_REDIS_PORT }}
          SPRING_DATA_REDIS_SSL_ENABLED: ${{ secrets.SPRING_DATA_REDIS_SSL_ENABLED }}
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          JWT_PUBLIC_KEY_PEM: ${{ secrets.JWT_PUBLIC_KEY_PEM }}
          JWT_KEY_ID: ${{ secrets.JWT_KEY_ID }}
          QUEUE_JWT_PRIVATE_KEY_PEM: ${{ secrets.QUEUE_JWT_PRIVATE_KEY_PEM }}
          QUEUE_JWT_PUBLIC_KEY_PEM: ${{ secrets.QUEUE_JWT_PUBLIC_KEY_PEM }}
          QUEUE_JWT_KEY_ID: ${{ secrets.QUEUE_JWT_KEY_ID }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          TICKET_PURCHASE_STRATEGY: ${{ secrets.TICKET_PURCHASE_STRATEGY }}
        run: |
          missing=0
          for name in \
            EC2_HOST \
            EC2_USER \
            EC2_SSH_KEY \
            REGISTRY_USERNAME \
            REGISTRY_TOKEN \
            SPRING_DATASOURCE_URL \
            SPRING_DATASOURCE_USERNAME \
            SPRING_DATASOURCE_PASSWORD \
            SPRING_DATA_REDIS_HOST \
            SPRING_DATA_REDIS_PORT \
            SPRING_DATA_REDIS_SSL_ENABLED \
            JWT_PRIVATE_KEY_PEM \
            JWT_PUBLIC_KEY_PEM \
            JWT_KEY_ID \
            QUEUE_JWT_PRIVATE_KEY_PEM \
            QUEUE_JWT_PUBLIC_KEY_PEM \
            QUEUE_JWT_KEY_ID \
            JWT_ISSUER \
            JWT_AUDIENCE \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            GOOGLE_REDIRECT_URI \
            TICKET_PURCHASE_STRATEGY
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/deploy_key <<'KEY'
          ${{ secrets.EC2_SSH_KEY }}
          KEY
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p ~/book-tickets"

      - name: Upload compose file
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/book-tickets/docker-compose.prod.yml"

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'REMOTE'
          set -euo pipefail
          cd ~/book-tickets

          cat > .env <<'ENV'
          BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend-image }}
          NGINX_IMAGE=${{ needs.build-and-push.outputs.nginx-image }}
          SPRING_PROFILES_ACTIVE=prod
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATA_REDIS_HOST=${{ secrets.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT=${{ secrets.SPRING_DATA_REDIS_PORT }}
          SPRING_DATA_REDIS_SSL_ENABLED=${{ secrets.SPRING_DATA_REDIS_SSL_ENABLED }}
          JWT_PRIVATE_KEY_PEM=${{ secrets.JWT_PRIVATE_KEY_PEM }}
          JWT_PUBLIC_KEY_PEM=${{ secrets.JWT_PUBLIC_KEY_PEM }}
          JWT_KEY_ID=${{ secrets.JWT_KEY_ID }}
          QUEUE_JWT_PRIVATE_KEY_PEM=${{ secrets.QUEUE_JWT_PRIVATE_KEY_PEM }}
          QUEUE_JWT_PUBLIC_KEY_PEM=${{ secrets.QUEUE_JWT_PUBLIC_KEY_PEM }}
          QUEUE_JWT_KEY_ID=${{ secrets.QUEUE_JWT_KEY_ID }}
          JWT_ISSUER=${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
          TICKET_PURCHASE_STRATEGY=${{ secrets.TICKET_PURCHASE_STRATEGY }}
          ENV

          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
          docker image prune -f
          REMOTE

      - name: Inspect remote deployment on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'REMOTE'
          set +e
          cd ~/book-tickets || exit 0
          echo "## docker version"
          docker version
          echo "## docker compose version"
          docker compose version
          echo "## docker compose ps"
          docker compose -f docker-compose.prod.yml ps
          echo "## backend logs"
          docker compose -f docker-compose.prod.yml logs backend --tail=200
          echo "## nginx logs"
          docker compose -f docker-compose.prod.yml logs nginx --tail=200
          REMOTE
