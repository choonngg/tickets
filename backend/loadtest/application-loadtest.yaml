# spring.config.additional-location으로만 읽는다. jar에는 포함되지 않는다.
server:
  address: 127.0.0.1
  port: 18080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 2000
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/ticket_loadtest?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: loadtest-only
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      ssl:
        enabled: false
  jpa:
    properties:
      hibernate:
        format_sql: false
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    enable:
      hikaricp: true
      jdbc: true
logging:
  level:
    root: WARN
ticket:
  queue:
    max-concurrent: 2000
    admit-per-cycle: 2000
    worker-delay-ms: 100
    worker-initial-delay-ms: 100
    fast-poll-ms: 100
    medium-poll-ms: 100
    slow-poll-ms: 100
