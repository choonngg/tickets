# External only, used with prod profile. Production Hikari defaults: max=10,
# minimum-idle=max, Tomcat max=200/min-spare=10/accept-count=100.
server:
  address: 127.0.0.1
  port: 18080
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/ticket_loadtest?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: loadtest-only
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      ssl:
        enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    root: WARN
