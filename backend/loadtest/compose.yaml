# 루트 개발 compose와 다른 프로젝트·포트·볼륨. 원격 Docker 사용 금지.
services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: loadtest-only
      MYSQL_DATABASE: ticket_loadtest
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=loadtest-only mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      timeout: 5s
      retries: 90
  redis:
    image: redis:7.2.4
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
  redis-data:
