spring:
  flyway:
    enabled: true
  application:
    name: ticket
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ticket?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
  refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}

ticket:
  purchase-strategy: ${TICKET_PURCHASE_STRATEGY:distributed}
