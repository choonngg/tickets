spring:
  flyway:
    enabled: true
  application:
    name: ticket
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ticket?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  private-key: ${JWT_PRIVATE_KEY_PEM}
  public-key: ${JWT_PUBLIC_KEY_PEM}
  key-id: ${JWT_KEY_ID}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}

ticket:
  purchase-strategy: ${TICKET_PURCHASE_STRATEGY:distributed}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}

auth:
  cookie-secure: ${AUTH_COOKIE_SECURE:true}
