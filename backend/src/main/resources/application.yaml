spring:
  flyway:
    enabled: true
  application:
    name: ticket
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ticket?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  private-key: ${JWT_PRIVATE_KEY_PEM}
  public-key: ${JWT_PUBLIC_KEY_PEM}
  key-id: ${JWT_KEY_ID}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}

ticket:
  queue:
    worker-delay-ms: 5000
    worker-initial-delay-ms: 5000
    jwt:
      private-key: ${QUEUE_JWT_PRIVATE_KEY_PEM}
      public-key: ${QUEUE_JWT_PUBLIC_KEY_PEM}
      key-id: ${QUEUE_JWT_KEY_ID:queue-key-1}
    max-concurrent: 1000
    admit-per-cycle: 100
    admitted-ttl-ms: 60000
    active-ttl-ms: 300000
    cleanup-batch-size: 200
    reregister-grace-ms: 30000
    fast-rank-threshold: 100
    medium-rank-threshold: 1000
    fast-poll-ms: 3000
    medium-poll-ms: 10000
    slow-poll-ms: 20000
  purchase-strategy: ${TICKET_PURCHASE_STRATEGY:pessimistic}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}

auth:
  cookie-secure: ${AUTH_COOKIE_SECURE:true}
