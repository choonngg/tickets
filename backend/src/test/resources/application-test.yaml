spring:
  # H2 tests use Hibernate DDL; MySQL integration tests run the real V1 migration.
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:ticket-test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-key-must-be-at-least-32-bytes
  access-token-minutes: 30
  refresh-token-days: 7
