# 로컬 개발용 Redis (운영 배포용은 docker-compose.prod.yml, 이 파일은 배포 대상 아님)
# 용도: 대기열 저장소. 설계(3_대기열 설계)대로 AOF appendfsync everysec + named volume으로 재시작 시 복구.
# 실행: docker compose -f docker-compose.local.yml up -d   /   중지: docker compose -f docker-compose.local.yml down
# 주의: 이미 6379를 쓰는 다른 Redis 컨테이너(예: ticket-redis)가 있으면 먼저 멈출 것(포트 충돌).
# 파일명 근거: prod 파일과 짝을 이루는 docker-compose.<환경>.yml 관례 유지, 소유 경로 docker-compose*.yml에 포함.
services:
  redis:
    image: redis:7.2.4
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ticket-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ticket-redis-data:
