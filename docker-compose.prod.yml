services:
  # 대기열 입장 Worker 때문에 backend는 단일 인스턴스로 운영한다(scale/replicas 금지).
  # 근거: 3_대기열 설계의 단일 Worker 전제. 2개 이상이면 주기당 입장 인원이 배가되고 admit-rate가 과소추정된다.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${BACKEND_IMAGE:-book-tickets-backend:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 240s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: ${NGINX_IMAGE:-book-tickets-nginx:latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
